name: Tasan
options:
  bundleIdPrefix: fi.tasan
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fi
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  TasanCore:
    path: Packages/TasanCore
targets:
  Tasan:
    type: application
    platform: iOS
    sources:
      - path: Tasan
    dependencies:
      - package: TasanCore
    configFiles:
      Debug: Config/Tasan.xcconfig
      Release: Config/Tasan.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.tasan.app
        PRODUCT_NAME: Tasan
        INFOPLIST_FILE: Tasan/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tasan/Resources/Tasan.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
schemes:
  Tasan:
    build:
      targets:
        Tasan: all
    test:
      targets:
        - package: TasanCore/TasanCoreTests
